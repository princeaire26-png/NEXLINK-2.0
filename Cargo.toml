[workspace]
resolver = "2"
members = [
    "agent",
    "protocol",
    "ai",
]
exclude = ["src-tauri"]
# Note: server/ is a Node.js/TypeScript project, not a Rust crate

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "proprietary"
repository = "https://github.com/nexlink/nexlink"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"

# Networking
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Base64
base64 = "0.22"

# Hex encoding
hex = "0.4"
