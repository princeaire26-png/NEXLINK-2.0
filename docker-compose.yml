version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexlink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexlink_dev}
      POSTGRES_DB: nexlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/migrations/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (session store, pub/sub, signaling)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NEXLINK Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://nexlink:${POSTGRES_PASSWORD:-nexlink_dev}@postgres:5432/nexlink
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      LOG_LEVEL: debug
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # NEXLINK Web Dashboard
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_WS_URL: ws://localhost:3001/ws
    depends_on:
      - server

  # MinIO (S3-compatible object storage for file transfers)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: nexlink
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nexlink_dev}
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
