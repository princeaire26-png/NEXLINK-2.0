name: Windows Agent Validation

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-agent:
    name: Compile and test Windows agent
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Build release agent
        run: cargo build --release --package nexlink-agent --target x86_64-pc-windows-msvc

      - name: Verify executable
        shell: pwsh
        run: |
          $agent = "target/x86_64-pc-windows-msvc/release/nexlink-agent.exe"
          if (!(Test-Path $agent)) {
            throw "Expected agent executable was not produced: $agent"
          }
          & $agent --version
          if ($LASTEXITCODE -ne 0) {
            throw "Agent --version returned exit code $LASTEXITCODE"
          }

      - name: Upload portable agent executable
        uses: actions/upload-artifact@v4
        with:
          name: NEXLINK-Agent-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/nexlink-agent.exe
          if-no-files-found: error
          retention-days: 30
